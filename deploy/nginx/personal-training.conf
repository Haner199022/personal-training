# Personal-Training reverse proxy
# 80 -> ACME challenge + 301 to 443; 443 SSL -> api:8000
# Replace api.example.com with your real domain before going live.

# ---- gzip (text/json/js/css; photos are already compressed, skip) ----
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    application/json
    application/javascript
    application/xml
    text/plain
    text/css
    text/javascript
    image/svg+xml;

# ---- HTTP :80 — ACME challenge + force HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Let's Encrypt webroot challenge (served before the redirect).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else -> HTTPS (微信小程序强制 https).
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS :443 — SSL terminate + reverse proxy ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    # certbot-issued certs (mounted from certbot-conf volume).
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # Modern, secure defaults.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — wechat mini-program requires https; lock it in.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 体脂照上传：允许 10MB 请求体。
    client_max_body_size 10m;

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
